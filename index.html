<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sample HTML5 template">
  <title>Test Project</title>

  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent: #2563eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .container {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      max-width: 480px;
      width: 90%;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 1.75rem;
    }

    p {
      color: var(--text-muted);
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Hello, World!</h1>
    <p>Your repository environment is live and working.</p>
    <button class="btn" onclick="showMessage()">Click Me</button>
  </main>

  <script>
    function showMessage() {
      alert("JavaScript is working properly!");
    }
  </script>

</body>
</html>
